; Stellar MCU SDK example: a standalone payment device (screen, keypad and relay) on an ESP32.
;   pio run -e s3 -t upload     ESP32-S3
;   pio run -e esp32 -t upload  classic ESP32
; The example builds the SDK straight from the repository folders.

[platformio]
default_envs = s3

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.9
    chris--a/Keypad@3.1.1
    ricmoo/QRCode@0.0.1
build_flags =
    -I../../src
    -I../../platforms/esp32-arduino
    -I../../third_party/monocypher
build_src_filter =
    +<*>
    +<../../../src/*.c>
    +<../../../platforms/esp32-arduino/*.cpp>
    +<../../../third_party/monocypher/*.c>

[env:s3]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32]
board = esp32dev
