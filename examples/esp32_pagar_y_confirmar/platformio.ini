; Ejemplo de Stellar MCU SDK para ESP32 con PlatformIO.
;   pio run -e s3 -t upload     ESP32-S3 DevKitC-1
;   pio run -e esp32 -t upload  ESP32 clásico (DevKit V1 / WROOM-32)
; El ejemplo compila el SDK directamente desde las carpetas del repositorio.

[platformio]
default_envs = s3

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
build_flags =
    -I../../src
    -I../../platforms/esp32-arduino
    -I../../third_party/monocypher
build_src_filter =
    +<*>
    +<../../../src/*.c>
    +<../../../platforms/esp32-arduino/*.cpp>
    +<../../../third_party/monocypher/*.c>

[env:s3]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32]
board = esp32dev
